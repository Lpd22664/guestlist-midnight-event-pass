<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guestlist responsive QA harness</title><style>*{box-sizing:border-box}body{margin:0;background:#eceef3;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#515158}header{padding:16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}select,button{padding:8px;border:1px solid #d4d9e3;border-radius:8px;background:#fff;font:inherit;color:#515158}main{width:max-content;margin:0 auto 24px}iframe{display:block;border:0;background:#f5f5f7;box-shadow:0 14px 45px #1a203018}small{display:block;text-align:center;line-height:1.7;margin-top:15px}</style></head><body><header><label>Width <select id="width"><option>390</option><option>375</option><option>320</option><option>1440</option><option>1280</option></select></label><label>View <select id="view"><option value="wallet">Pass</option><option value="issue">Organiser</option><option value="passes">Issued passes</option><option value="checkin">Check-in</option><option value="network">Connection</option></select></label><label>Text <select id="scale"><option value="100">100%</option><option value="200">200%</option></select></label><button id="capture">Full layout height</button></header><main><iframe id="frame" title="Guestlist responsive preview" width="390" height="844" src="/index.html#wallet"></iframe><small>Same-origin rendered app · CSS viewport test<br>No device or assistive-technology certification</small></main><script>const frame=document.querySelector('#frame');const applyScale=()=>{frame.contentDocument.documentElement.style.fontSize=document.querySelector('#scale').value+'%'};frame.onload=applyScale;document.querySelector('#scale').onchange=applyScale;document.querySelector('#width').onchange=e=>{frame.width=e.target.value;frame.height=844};document.querySelector('#view').onchange=e=>{frame.src='/index.html#'+e.target.value;frame.height=844};document.querySelector('#capture').onclick=()=>{frame.height=Math.max(844,frame.contentDocument.documentElement.scrollHeight)};</script></body></html>
